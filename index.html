<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14183a">
<title>乘法火箭</title>
<style>
:root{
  --bg:#14183a; --bg2:#1f2560; --card:#262d6e; --ink:#ffffff; --muted:#b9c0f0; --line:#3a4290;
  --pri:#ffb627; --pri-ink:#1b1b1b; --ok:#2ecc71; --bad:#ff5d5d; --warn:#ffd34d; --gray:#4a5194;
  --fire:#ff7a1a; --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,#2a3180 0%,var(--bg) 60%) fixed;color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.45;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 30%,#fff,transparent),radial-gradient(1px 1px at 80% 80%,#fff,transparent),radial-gradient(1px 1px at 90% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 90%,#fff,transparent)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;max-width:1100px;margin:0 auto;min-height:100dvh;padding:14px 16px 20px;display:flex;flex-direction:column}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:8px 22px;border-radius:16px;
  background:var(--card);border:2px solid var(--line);font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.icon{min-width:56px;padding:8px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-height:56px}
.topbar h2{margin:0;flex:1;font-size:1.4rem}
.pill{background:rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;font-weight:800}
/* 首頁 */
.hero{text-align:center;margin:8px 0 6px}
.hero .rocket{font-size:4rem;display:inline-block;animation:float 2.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-6deg)}}
.hero h1{margin:0;font-size:2.4rem;letter-spacing:.12em;color:var(--pri)}
.hero p{margin:2px 0 0;color:var(--muted)}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.level{background:var(--card);border-radius:var(--radius);padding:14px 18px;border:2px solid var(--line);margin-bottom:14px}
.level .row{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.level .bar{height:14px;background:var(--bg);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.level .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--fire))}
.level small{color:var(--muted)}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:110px;border-radius:24px;
  background:linear-gradient(135deg,var(--pri),var(--fire));color:var(--pri-ink);font-size:1.8rem;font-weight:900;box-shadow:0 6px 0 #a3480a;margin-bottom:14px}
.big small{font-size:1rem;font-weight:700}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a3480a}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.menu .btn{min-height:80px;font-size:1.1rem;flex-direction:column;gap:2px}
.menu .btn small{font-weight:600;color:var(--muted);font-size:.85rem}
/* 遊戲 */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud .time{font-size:1.6rem;font-weight:900;min-width:96px}
.hud .time.low{color:var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.hud .score{font-size:1.6rem;font-weight:900;color:var(--pri);margin-left:auto}
.timebar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:8px 0}
.timebar i{display:block;height:100%;background:var(--ok);transition:background .3s}
.ghost{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem}
.ghost .track{flex:1;height:22px;background:var(--bg2);border-radius:99px;position:relative;overflow:hidden}
.ghost .me,.ghost .gh{position:absolute;top:0;height:100%;border-radius:99px}
.ghost .gh{background:rgba(255,255,255,.22)}
.ghost .me{background:var(--pri);height:60%;top:20%}
.ghost .lead{min-width:96px;text-align:right}
.lead.up{color:var(--ok)} .lead.down{color:var(--bad)}
.playwrap{flex:1;display:flex;flex-direction:column;gap:14px;margin-top:8px}
.qbox{position:relative;background:var(--card);border-radius:28px;border:3px solid var(--line);padding:18px 16px;text-align:center;transition:box-shadow .3s,border-color .3s}
.qbox.fire{border-color:var(--fire);box-shadow:0 0 18px 4px rgba(255,122,26,.7),inset 0 0 20px rgba(255,122,26,.35);animation:flame 1s infinite alternate}
.qbox.fire2{box-shadow:0 0 28px 8px rgba(255,60,0,.85),inset 0 0 30px rgba(255,180,0,.45)}
@keyframes flame{to{box-shadow:0 0 26px 8px rgba(255,160,26,.8),inset 0 0 26px rgba(255,122,26,.45)}}
.combo{position:absolute;top:10px;right:16px;font-weight:900;color:var(--fire);font-size:1.2rem}
.mult{position:absolute;top:10px;left:16px;font-weight:900;color:var(--pri);font-size:1.1rem}
.q{font-size:clamp(3rem,13vw,5.5rem);font-weight:900;letter-spacing:.04em;line-height:1.2;white-space:nowrap}
.ans{display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;min-height:1.2em;border-bottom:6px solid var(--pri);color:var(--pri)}
.ans.ok{color:var(--ok);border-color:var(--ok)}
.ans.bad{color:var(--bad);border-color:var(--bad)}
.fix{min-height:1.6em;font-size:1.3rem;font-weight:800}
.fix.bad{color:var(--bad)} .fix.ok{color:var(--ok)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{min-height:68px;border-radius:18px;background:#323a8c;font-size:2rem;font-weight:900;box-shadow:0 5px 0 #0d1030}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #0d1030;background:#3d46a3}
.key.fn{font-size:1.4rem;background:#2a3070}
.key.go{background:var(--ok);color:#06331a;font-size:1.6rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.18)}}
.float{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-weight:900;font-size:1.6rem;color:var(--pri);pointer-events:none;animation:up .8s forwards}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;font-size:2.6rem;font-weight:900;color:var(--fire);
  text-shadow:0 3px 0 #000;animation:banner 1s forwards;white-space:nowrap}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:9rem;font-weight:900;color:var(--pri);background:rgba(10,12,40,.75);z-index:9}
/* 結果、排行榜 */
.panel{background:var(--card);border-radius:var(--radius);border:2px solid var(--line);padding:18px}
.result{text-align:center;max-width:620px;margin:auto;width:100%}
.result .sc{font-size:4.2rem;font-weight:900;color:var(--pri);line-height:1.1}
.result h2{margin:.2em 0;font-size:1.8rem}
.result .tip{font-size:1.15rem;color:var(--warn);font-weight:800}
.result .grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.result .grid3 div{background:var(--bg2);border-radius:14px;padding:8px 4px}
.result .grid3 b{display:block;font-size:1.4rem}
.result .grid3 small{color:var(--muted)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.9rem}
tr.me td{background:rgba(255,182,39,.18);font-weight:900}
.medal{font-size:1.4rem}
.wrongs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.wrongs span{background:rgba(255,93,93,.18);border:1px solid var(--bad);border-radius:10px;padding:4px 10px;font-weight:800}
/* 精熟地圖 */
.map{display:grid;grid-template-columns:1.6em repeat(9,minmax(0,1fr));gap:3px;font-weight:800}
.panel:has(.map){padding:10px}
.map .h{display:flex;align-items:center;justify-content:center;color:var(--pri);font-size:1.1rem;min-height:36px}
.cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(.6rem,2.2vw,.95rem);line-height:1.1;background:var(--gray);color:#e5e8ff}
.cell.g{background:var(--ok);color:#06331a} .cell.y{background:var(--warn);color:#4a3600} .cell.r{background:var(--bad);color:#3d0000}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:.95rem}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:4px;vertical-align:-2px;background:var(--c)}
.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tables .btn{min-height:90px;font-size:1.6rem;flex-direction:column}
.tables .btn small{font-size:.85rem;color:var(--muted);font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* 平板橫式：題目在左、鍵盤在右 */
@media (min-width:900px) and (orientation:landscape){
  .playwrap{flex-direction:row;align-items:stretch}
  .playwrap .qside{flex:1.3;display:flex;flex-direction:column;justify-content:center}
  .playwrap .keypad{flex:1;align-content:center}
  .key{min-height:84px}
  .qbox{padding:40px 16px}
}
.qbox{padding-top:44px}
@media (max-width:899px) and (min-height:760px){ .key{min-height:84px} .playwrap{justify-content:space-between} }
@media (max-height:700px){ .key{min-height:56px;font-size:1.7rem} .qbox{padding:10px} .hero .rocket{font-size:3rem} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="sr" class="sr-only" aria-live="assertive"></div>
<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const announce = t => { const s=$('#sr'); s.textContent=''; setTimeout(()=>s.textContent=t,30); };
const NUMS = [2,3,4,5,6,7,8,9,10];
const FACTS = NUMS.flatMap(a => NUMS.map(b => ({a,b,k:a+'x'+b})));
const RUSH_MS = 60000;

// ---------- 存檔 ----------
const SKEY = 'mul-rocket-v1';
let S;
function load(){
  try { S = JSON.parse(localStorage.getItem(SKEY)) || {}; } catch(e){ S = {}; }
  S.top5 ??= []; S.facts ??= {}; S.total ??= 0; S.streak ??= 0; S.lastDay ??= ''; S.badges ??= []; S.games ??= 0;
}
function save(){ try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch(e){} }
load();
const dayStr = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function touchStreak(){
  const today = dayStr();
  if (S.lastDay === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  S.streak = (S.lastDay === dayStr(y)) ? S.streak+1 : 1;
  S.lastDay = today;
}
const liveStreak = () => { const y=new Date(); y.setDate(y.getDate()-1); return (S.lastDay===dayStr()||S.lastDay===dayStr(y)) ? S.streak : 0; };

// ---------- 等級 ----------
const LEVELS = [
  {n:0,   e:'🌍', t:'地球'}, {n:50,  e:'🌙', t:'月球'}, {n:150, e:'🔴', t:'火星'},
  {n:300, e:'🟠', t:'木星'}, {n:500, e:'🪐', t:'土星'}, {n:800, e:'🌌', t:'銀河'}
];
function levelOf(total){
  let i = LEVELS.findLastIndex ? LEVELS.findLastIndex(l=>total>=l.n) : LEVELS.map(l=>total>=l.n).lastIndexOf(true);
  const cur = LEVELS[i], nxt = LEVELS[i+1];
  return {i, cur, nxt, pct: nxt ? (total-cur.n)/(nxt.n-cur.n)*100 : 100};
}

// ---------- 熟練度 ----------
function factState(k){
  const f = S.facts[k]; if (!f || f.c+f.w===0) return 'n';
  const acc = f.c/(f.c+f.w), avg = f.c ? f.t/f.c : 99;
  if (acc < .8) return 'r';
  if (avg > 3 || f.c < 2) return 'y';
  return 'g';
}
function factWeight(k){
  const f = S.facts[k] || {c:0,w:0,t:0};
  const st = factState(k);
  return {n:3, r:6, y:3, g:1}[st] + Math.min(f.w,5);
}
function weightedFact(prev){
  const list = FACTS.filter(f=>f.k!==prev);
  const ws = list.map(f=>factWeight(f.k)); let r = Math.random()*ws.reduce((a,b)=>a+b,0);
  for (let i=0;i<list.length;i++){ r-=ws[i]; if (r<=0) return list[i]; }
  return list[0];
}
function recordFact(k, ok, sec){
  const f = S.facts[k] ??= {c:0,w:0,t:0};
  if (ok){ f.c++; f.t += Math.min(sec,10); } else f.w++;
}

// ---------- 音效、特效 ----------
let AC;
function tone(seq, type='triangle'){
  try{
    AC ??= new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state==='suspended') AC.resume();
    let t = AC.currentTime;
    for (const [f,d] of seq){
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.start(t); o.stop(t+d); t+=d*.8;
    }
  }catch(e){}
}
const sOk = c => tone([[523*Math.pow(2,Math.min(c,24)/12),.12]]);
const sBad = () => { tone([[180,.28]],'sawtooth'); try{ navigator.vibrate && navigator.vibrate(120); }catch(e){} };
const sWin = () => tone([[523,.12],[659,.12],[784,.12],[1047,.35]]);
const sTick = () => tone([[880,.05]],'square');
function confetti(){
  const box=document.createElement('div'); box.className='confetti';
  const cols=['#ffb627','#ff7a1a','#2ecc71','#5aa9ff','#ff5d8f','#ffffff'];
  for(let i=0;i<70;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=pick(cols);e.style.animationDelay=Math.random()*.7+'s';box.appendChild(e);}
  document.body.appendChild(box); setTimeout(()=>box.remove(),2800);
}
function banner(text){ const b=document.createElement('div'); b.className='banner'; b.textContent=text; document.body.appendChild(b); setTimeout(()=>b.remove(),1000); }

// ---------- 首頁 ----------
function home(){
  stopGame();
  const lv = levelOf(S.total), best = S.top5[0]?.score || 0;
  const green = FACTS.filter(f=>factState(f.k)==='g').length;
  app.innerHTML = `
    <header class="hero"><span class="rocket" aria-hidden="true">🚀</span><h1>乘法火箭</h1><p>2 ～ 10 的乘法，看你能飛多遠！</p></header>
    <div class="stats"><span class="pill">🏆 最高 ${best} 分</span><span class="pill">🔥 連續 ${liveStreak()} 天</span><span class="pill">✅ 精熟 ${green} / 81</span></div>
    <section class="level" aria-label="火箭等級">
      <div class="row"><span>${lv.cur.e} 目前在：${lv.cur.t}</span><span>${lv.nxt?`下一站 ${lv.nxt.e} ${lv.nxt.t}`:'已抵達終點！'}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${lv.pct}%"></i></div>
      <small>累積答對 ${S.total} 題${lv.nxt?`，再答對 ${lv.nxt.n-S.total} 題就能飛到${lv.nxt.t}`:''}</small>
    </section>
    <button class="big" data-go="rush">🚀 60 秒火箭挑戰<small>答越快、連對越多，分數越高</small></button>
    <nav class="menu" aria-label="其他模式">
      <button class="btn" data-go="tables">🎯 乘法表練習<small>選一個乘法表慢慢練</small></button>
      <button class="btn" data-go="weak">🔥 弱點特訓<small>專練常錯、較慢的題目</small></button>
      <button class="btn" data-go="ranks">🏆 前 5 名<small>跟自己比賽</small></button>
      <button class="btn" data-go="map">🗺️ 精熟地圖<small>81 題熟練度</small></button>
    </nav>`;
}

// ---------- 遊戲核心 ----------
let G = null, raf = 0;
function stopGame(){ cancelAnimationFrame(raf); raf=0; if (G){ G.dead = true; } G=null; }

function startGame(mode, table){
  stopGame();
  G = {mode, table, score:0, combo:0, maxCombo:0, ok:0, bad:0, input:'', q:null, prev:null, lock:false,
       wrongs:{}, curve:[], queue:[], done:0, total:0, penalty:0, pausedAt:0, pausedSum:0, t0:0, lastSec:-1};
  if (mode==='table'){ G.queue = [...shuffle(NUMS), ...shuffle(NUMS)].map(b=>({a:table,b,k:table+'x'+b})); }
  if (mode==='weak'){
    const ranked = FACTS.map(f=>[factWeight(f.k)+Math.random(), f]).sort((x,y)=>y[0]-x[0]).slice(0,15).map(x=>x[1]);
    G.queue = shuffle(ranked);
  }
  G.total = G.queue.length;
  renderPlay();
  if (mode==='rush') countdown(()=>{ G.t0 = performance.now(); nextQ(); loop(); });
  else nextQ();
}
function countdown(done){
  const c = document.createElement('div'); c.className='countdown'; c.setAttribute('aria-live','assertive'); document.body.appendChild(c);
  let n = 3; const step = () => { if (!G){ c.remove(); return; } if (n===0){ c.remove(); tone([[1047,.25]]); done(); return; } c.textContent=n; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); sTick(); n--; setTimeout(step,700); };
  step();
}
const elapsed = () => (G.pausedAt||performance.now()) - G.t0 - G.pausedSum + G.penalty;
const bestCurve = () => S.top5[0]?.curve || null;

function renderPlay(){
  const rush = G.mode==='rush';
  const title = rush ? '' : G.mode==='table' ? `🎯 ${G.table} 的乘法表` : '🔥 弱點特訓';
  app.innerHTML = `
    <div class="hud">
      <button class="btn icon" data-act="quit" aria-label="離開">✖</button>
      ${rush ? `<span class="time" id="time" aria-label="剩餘時間">60.0</span>` : `<span class="pill">${title}</span><span class="pill" id="prog">0 / ${G.total}</span>`}
      <span class="score" id="score" aria-live="off">${rush?'0 分':''}</span>
    </div>
    ${rush ? `<div class="timebar" aria-hidden="true"><i id="tbar" style="width:100%"></i></div>
      ${bestCurve()?`<div class="ghost" aria-hidden="true"><span>👻 最佳</span><div class="track"><span class="gh" id="gh"></span><span class="me" id="me"></span></div><span class="lead" id="lead">±0</span></div>`:'<div class="ghost" style="color:var(--muted)">第一次挑戰！打完就會有你的影子紀錄 👻</div>'}`
      : `<div class="timebar" aria-hidden="true"><i id="tbar" style="width:0%;background:var(--pri)"></i></div>`}
    <div class="playwrap">
      <div class="qside">
        <div class="qbox" id="qbox">
          <span class="mult" id="mult"></span><span class="combo" id="combo"></span>
          <div class="q" id="q" aria-live="polite">&nbsp;</div>
          <div class="fix" id="fix"></div>
        </div>
      </div>
      <div class="keypad" role="group" aria-label="數字鍵盤">
        ${[7,8,9,4,5,6,1,2,3].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
        <button class="key fn" data-k="BS" aria-label="刪除">⌫</button>
        <button class="key" data-k="0">0</button>
        <button class="key go" data-k="OK" aria-label="送出">✔</button>
      </div>
    </div>`;
  app.querySelectorAll('.key').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); press(b.dataset.k); }));
}
function nextQ(){
  if (!G) return;
  let q;
  if (G.mode==='rush') q = weightedFact(G.prev);
  else { q = G.queue.shift(); if (!q) return finish(); }
  G.q = q; G.prev = q.k; G.input = ''; G.qStart = performance.now(); G.lock = false;
  drawQ();
  $('#fix').textContent=''; $('#fix').className='fix';
}
function drawQ(state){
  const q = G.q; if (!q) return;
  $('#q').innerHTML = `${q.a} × ${q.b} = <span class="ans ${state||''}">${G.input||'?'}</span>`;
}
function press(k){
  if (!G || !G.q || G.lock || (G.mode==='rush' && !G.t0)) return;
  const ans = String(G.q.a*G.q.b);
  if (k==='BS'){ G.input = G.input.slice(0,-1); drawQ(); return; }
  if (k==='OK'){ if (G.input) judge(G.input===ans); return; }
  if (G.input.length >= 3) return;
  G.input += k; tone([[600,.03]],'sine');
  if (G.input === ans) judge(true);
  else if (G.input.length >= ans.length) judge(false);
  else drawQ();
}
function judge(ok){
  const q = G.q, ans = q.a*q.b, sec = (performance.now()-G.qStart)/1000;
  G.lock = true;
  recordFact(q.k, ok, sec);
  const qb = $('#qbox');
  if (ok){
    G.ok++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); S.total++;
    let gain = 0;
    if (G.mode==='rush'){
      const mult = G.combo>=10?3 : G.combo>=5?2 : 1;
      gain = 10*mult + (sec<2?5:0);
      G.score += gain;
      floatText(`+${gain}${sec<2?' ⚡':''}`);
    } else G.done++;
    sOk(G.combo);
    drawQ('ok');
    if ([5,10,20,30,40,50].includes(G.combo)){ banner(`🔥 ${G.combo} 連對！`); tone([[784,.08],[1047,.08],[1319,.2]]); }
    announce('答對');
    const gg=G; setTimeout(()=>{ if (G===gg) nextQ(); }, G.mode==='rush'?180:450);
  } else {
    G.bad++; G.combo = 0;
    G.wrongs[q.k] = (G.wrongs[q.k]||0)+1;
    sBad();
    drawQ('bad'); qb.classList.remove('shake'); void qb.offsetWidth; qb.classList.add('shake');
    const fix = $('#fix'); fix.className='fix bad';
    fix.textContent = `${q.a} × ${q.b} = ${ans}` + (G.mode==='rush'?'　⏱ −2 秒':'　等一下再練一次！');
    announce(`答錯，${q.a} 乘 ${q.b} 等於 ${ans}`);
    if (G.mode==='rush') G.penalty += 2000;
    else G.queue.splice(Math.min(3,G.queue.length), 0, q);   // 答錯的題目稍後再出
    const gg=G; setTimeout(()=>{ if (G===gg) nextQ(); }, G.mode==='rush'?1000:1600);
  }
  updateHud();
}
function floatText(t){ const f=document.createElement('div'); f.className='float'; f.textContent=t; $('#qbox')?.appendChild(f); setTimeout(()=>f.remove(),800); }
function updateHud(){
  if (!G) return;
  const qb = $('#qbox'); if (!qb) return;
  qb.classList.toggle('fire', G.combo>=5); qb.classList.toggle('fire2', G.combo>=10);
  $('#combo').textContent = G.combo>=2 ? `🔥 ${G.combo}` : '';
  if (G.mode==='rush'){
    $('#score').textContent = G.score+' 分';
    $('#mult').textContent = G.combo>=10?'×3 分數':G.combo>=5?'×2 分數':'';
  } else {
    $('#prog').textContent = `${G.done} / ${G.total}`;
    $('#tbar').style.width = (G.done/Math.max(G.total, G.done+G.queue.length+(G.lock?0:1))*100)+'%';
  }
}
function loop(){
  if (!G || G.mode!=='rush') return;
  const left = Math.max(0, RUSH_MS - elapsed());
  const sec = Math.floor((RUSH_MS-left)/1000);
  if (sec !== G.lastSec){ for (let s=G.lastSec+1; s<=sec && s<=60; s++) G.curve[s] = G.score; G.lastSec = sec; if (left<=5000 && left>0) sTick(); }
  G.curve[sec] = G.score;
  const t = $('#time');
  if (t){
    t.textContent = (left/1000).toFixed(1);
    t.classList.toggle('low', left<=10000);
    const bar = $('#tbar'); bar.style.width = (left/RUSH_MS*100)+'%'; bar.style.background = left<=10000?'var(--bad)':left<=25000?'var(--warn)':'var(--ok)';
    const bc = bestCurve();
    if (bc){
      const gScore = bc[Math.min(sec, bc.length-1)] ?? bc[bc.length-1], top = Math.max(bc[bc.length-1]||1, G.score, 1);
      $('#gh').style.width = (gScore/top*100)+'%'; $('#me').style.width = (G.score/top*100)+'%';
      const d = G.score - gScore, ld = $('#lead');
      ld.textContent = d>0?`領先 +${d}`:d<0?`落後 ${d}`:'平手'; ld.className = 'lead '+(d>0?'up':d<0?'down':'');
    }
  }
  if (left <= 0){ finish(); return; }
  raf = requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => {
  if (!G || G.mode!=='rush' || !G.t0) return;
  if (document.hidden){ G.pausedAt = performance.now(); cancelAnimationFrame(raf); }
  else if (G.pausedAt){ G.pausedSum += performance.now()-G.pausedAt; G.pausedAt = 0; loop(); }
});
document.addEventListener('keydown', e => {
  if (!G) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key==='Backspace') press('BS');
  else if (e.key==='Enter') press('OK');
  else if (e.key==='Escape') home();
});

// ---------- 結算 ----------
function finish(){
  if (!G || G.finished) return;
  G.finished = true; cancelAnimationFrame(raf);
  const g = G; G = null;
  S.games++; touchStreak();
  const acc = g.ok+g.bad ? Math.round(g.ok/(g.ok+g.bad)*100) : 0;
  const lvBefore = levelOf(S.total - g.ok).i, lv = levelOf(S.total);
  const wrongList = Object.keys(g.wrongs).map(k=>k.replace('x',' × '));
  let head = '', tip = '', rank = 0, rec = null;
  if (g.mode==='rush'){
    g.curve[60] = g.score;
    for (let s=1; s<=60; s++) if (g.curve[s]==null) g.curve[s] = g.curve[s-1] ?? 0;
    g.curve[0] ??= 0;
    rec = {score:g.score, ok:g.ok, acc, combo:g.maxCombo, date:new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}), ts:Date.now(), curve:g.curve.slice(0,61)};
    const list = [...S.top5, rec].sort((a,b)=>b.score-a.score || a.ts-b.ts);
    rank = list.indexOf(rec)+1;
    S.top5 = list.slice(0,5);
    if (rank===1 && S.top5.length>1){ head='🎉 新紀錄！第 1 名！'; }
    else if (rank===1){ head='🚀 第一筆紀錄誕生！'; }
    else if (rank<=5){ head=`🏅 擠進前 5 名！第 ${rank} 名`; }
    else head = '再接再厲！';
    const first = S.top5[0].score, fifth = S.top5[4]?.score;
    if (rank>5) tip = `再 ${fifth - g.score + 1} 分就能進前 5 名！`;
    else if (rank>1) tip = `再 ${first - g.score + 1} 分就能超越第 1 名！`;
    else if (S.top5[1]) tip = `比第 2 名多了 ${g.score - S.top5[1].score} 分，太強了！`;
  } else {
    head = g.bad===0 ? '🌟 全對！完美！' : '✅ 練習完成！';
    if (g.mode==='table' && !S.badges.includes('T'+g.table)){ S.badges.push('T'+g.table); tip = `獲得「${g.table} 的乘法表」徽章 🎖️`; }
  }
  save();
  if (rank && rank<=5 || g.bad===0){ confetti(); sWin(); } else tone([[392,.15],[330,.25]]);
  const lvMsg = lv.i>lvBefore ? `<p class="tip">🚀 火箭升級！抵達 ${lv.cur.e} ${lv.cur.t}！</p>` : (lv.nxt?`<p style="color:var(--muted)">${lv.cur.e} → ${lv.nxt.e} ${lv.nxt.t} 還差 ${lv.nxt.n-S.total} 題</p>`:'');
  app.innerHTML = `<section class="panel result" aria-label="成績">
    <h2>${head}</h2>
    ${g.mode==='rush'?`<div class="sc">${g.score}<small style="font-size:1.4rem"> 分</small></div>`:''}
    ${tip?`<p class="tip">${tip}</p>`:''}
    <div class="grid3"><div><b>${g.ok}</b><small>答對</small></div><div><b>${g.bad}</b><small>答錯</small></div><div><b>${acc}%</b><small>正確率</small></div><div><b>🔥${g.maxCombo}</b><small>最高連對</small></div></div>
    ${lvMsg}
    ${wrongList.length?`<p style="margin:6px 0 0">要再記一下：</p><div class="wrongs">${wrongList.map(w=>{const [a,b]=w.split(' × ');return `<span>${w} = ${a*b}</span>`;}).join('')}</div>`:''}
    ${g.mode==='rush'?ranksTable(rec):''}
    <div class="row"><button class="btn pri" data-act="again">🔁 再挑戰一次</button><button class="btn" data-go="home">🏠 首頁</button></div>
  </section>`;
  $('[data-act=again]').onclick = () => startGame(g.mode, g.table);
  $('[data-act=again]').focus();
}
function ranksTable(mine){
  if (!S.top5.length) return '<p>還沒有紀錄，快去挑戰吧！</p>';
  const md = ['🥇','🥈','🥉','4','5'];
  return `<table style="margin-top:12px"><thead><tr><th>名次</th><th>分數</th><th>答對</th><th>正確率</th><th>連對</th><th>日期</th></tr></thead><tbody>
    ${S.top5.map((r,i)=>`<tr class="${r===mine||(mine&&r.ts===mine.ts)?'me':''}"><td class="medal">${md[i]}</td><td>${r.score}</td><td>${r.ok}</td><td>${r.acc}%</td><td>${r.combo}</td><td>${r.date}</td></tr>`).join('')}
  </tbody></table>`;
}

// ---------- 其他畫面 ----------
function ranks(){
  app.innerHTML = `<div class="topbar"><button class="btn icon" data-go="home" aria-label="回首頁">🏠</button><h2>🏆 60 秒挑戰 前 5 名</h2></div>
    <div class="panel">${ranksTable(null)}<p style="color:var(--muted);margin-bottom:0">挑戰時，畫面上的 👻 影子就是第 1 名的你，努力超越它！</p></div>
    <div class="row"><button class="btn pri" data-go="rush">🚀 開始挑戰</button></div>`;
}
function tables(){
  app.innerHTML = `<div class="topbar"><button class="btn icon" data-go="home" aria-label="回首頁">🏠</button><h2>🎯 選一個乘法表</h2></div>
    <p style="margin-top:0;color:var(--muted)">每個乘法表練 2 輪，全部答對就能拿到徽章 🎖️</p>
    <div class="tables">${NUMS.map(n=>{
      const g = NUMS.filter(b=>factState(n+'x'+b)==='g').length;
      return `<button class="btn" data-go="table" data-n="${n}">${S.badges.includes('T'+n)?'🎖️ ':''}${n} 的乘法表<small>精熟 ${g} / 9</small></button>`; }).join('')}</div>`;
}
function map(){
  const cnt = {g:0,y:0,r:0,n:0}; FACTS.forEach(f=>cnt[factState(f.k)]++);
  const icon = {g:'✔',y:'…',r:'✖',n:''};
  app.innerHTML = `<div class="topbar"><button class="btn icon" data-go="home" aria-label="回首頁">🏠</button><h2>🗺️ 乘法精熟地圖</h2></div>
    ${cnt.g===81?'<p class="panel" style="text-align:center;font-size:1.3rem;font-weight:900;color:var(--pri)">👑 恭喜成為乘法大師！81 題全部精熟！</p>':''}
    <div class="panel">
      <div class="map" role="table" aria-label="乘法熟練度表">
        <div class="h">×</div>${NUMS.map(n=>`<div class="h">${n}</div>`).join('')}
        ${NUMS.map(a=>`<div class="h">${a}</div>`+NUMS.map(b=>{ const k=a+'x'+b, st=factState(k), f=S.facts[k];
          const tip = f?`答對 ${f.c} 次、答錯 ${f.w} 次${f.c?`、平均 ${(f.t/f.c).toFixed(1)} 秒`:''}`:'還沒練過';
          return `<div class="cell ${st}" role="cell" aria-label="${a} 乘 ${b}：${tip}" title="${tip}"><span>${a*b}</span><span aria-hidden="true">${icon[st]}</span></div>`; }).join('')).join('')}
      </div>
      <div class="legend"><span style="--c:var(--ok)">✔ 熟練 ${cnt.g}</span><span style="--c:var(--warn)">… 還有點慢 ${cnt.y}</span><span style="--c:var(--bad)">✖ 常答錯 ${cnt.r}</span><span style="--c:var(--gray)">沒練過 ${cnt.n}</span></div>
    </div>
    <div class="row"><button class="btn pri" data-go="weak">🔥 弱點特訓</button></div>
    <details class="panel" style="margin-top:16px"><summary style="cursor:pointer;font-weight:800">家長設定</summary>
      <p>共玩了 ${S.games} 場。</p><button class="btn" data-act="reset" style="border-color:var(--bad);color:var(--bad)">🗑️ 清除所有紀錄</button></details>`;
  $('[data-act=reset]').onclick = () => { if (confirm('確定要清除排行榜、精熟地圖和所有紀錄嗎？清除後無法復原。')){ try{localStorage.removeItem(SKEY);}catch(e){} load(); home(); } };
}

// ---------- 導覽 ----------
app.addEventListener('click', e => {
  const b = e.target.closest('[data-go],[data-act=quit]'); if (!b) return;
  if (b.dataset.act==='quit'){
    if (!G || G.ok+G.bad===0 || confirm('要離開嗎？這一場的成績不會保存。')) home();
    return;
  }
  const {go, n} = b.dataset;
  ({home, rush:()=>startGame('rush'), weak:()=>startGame('weak'), table:()=>startGame('table', +n), tables, ranks, map})[go]();
});
home();
</script>
</body>
</html>
